<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quorum</title>
  <link rel="icon" href="data:,">
  <style>html, body { background: #0A0E16; margin: 0; }</style>
  <!-- Assets are always at /web/: the device server sends this page at "/" and mounts app/web at
       "/web"; a plain static server rooted at app/ serves the same paths. -->
  <link rel="stylesheet" href="/web/styles.css">
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="brand">
        <div class="mark" aria-hidden="true"><i></i><i></i><i></i></div>
        <div class="brand-text">
          <div class="device-name" id="device-name">Quorum</div>
          <div class="device-sub"><span id="live" class="live" title="Live updates from this device">connecting</span><span class="sep">·</span>edge node · Qdrant Edge</div>
        </div>
      </div>

      <button id="hub-switch" class="hub-switch" role="switch" aria-checked="true" title="Stop or resume this device's sync with the team hub">
        <span class="track"><span class="knob"></span></span>
        <span class="hub-label" id="hub-label">Connected to hub</span>
      </button>

      <div class="stats">
        <div class="stat outbox" id="outbox-stat" title="Claims waiting to reach the hub">
          <span class="k">Outbox</span><span class="v" id="outbox">0</span>
        </div>
        <div class="stat net" title="Bytes exchanged with the hub by this device's sync worker">
          <canvas id="spark" width="72" height="30"></canvas>
          <div class="net-text">
            <div class="rate" id="rate">0 B/s</div>
            <div class="totals"><span>↑ <b id="up-total">0 B</b></span><span>↓ <b id="down-total">0 B</b></span></div>
          </div>
        </div>
        <div class="stat hub" id="hub-stat" title="Hub status">
          <span class="dot" id="hub-dot"></span><span class="k" id="hub-text">hub</span>
        </div>
      </div>
    </header>

    <main class="grid">
      <section class="cloud-wrap" id="cloud-wrap" aria-label="Memory cloud">
        <canvas id="cloud"></canvas>
        <div class="cloud-head">
          <div class="cloud-title" id="cloud-title">Memory</div>
          <div class="cloud-subtitle" id="cloud-subtitle">every point is a claim on this device</div>
        </div>
        <div class="view-toggle" role="tablist" aria-label="View">
          <button data-view="mine" class="on" role="tab">Mine</button>
          <button data-view="team" role="tab">Team view</button>
        </div>
        <div class="legend" id="legend"></div>
        <div class="claim-card hidden" id="claim-card"></div>
        <div class="conflict-card hidden" id="conflict-card" aria-live="polite"></div>
      </section>

      <section class="panel assistant" aria-label="Assistant">
        <div class="panel-head">
          <h2>Ask</h2>
          <span class="panel-note" id="ask-scope">searching everything on this device</span>
        </div>
        <form id="ask-form" class="ask-form" autocomplete="off">
          <input id="ask-input" type="text" placeholder="Ask your team's memory…" aria-label="Question">
          <button type="submit" class="btn primary">Ask</button>
        </form>
        <div class="suggestions" id="suggestions">
          <button type="button" data-q="What's due this week?">What's due this week?</button>
          <button type="button" data-q="When is the Sharma delivery?">When is the Sharma delivery?</button>
        </div>
        <div class="answer empty" id="answer">
          <div class="answer-empty">Answers come from claims on this device, with their sources. No cloud calls.</div>
        </div>
      </section>

      <div class="side">
        <section class="panel capture" aria-label="Capture">
          <div class="panel-head"><h2>Capture</h2><span class="panel-note">extracted on this device</span></div>
          <form id="note-form" class="note-form" autocomplete="off">
            <input id="note-input" type="text" placeholder="Quick note, e.g. “Client says the shoot moves to Friday”" aria-label="Quick note">
            <button type="submit" class="btn">Save</button>
          </form>
          <div class="inbox-head"><span>Inbox</span><span class="count" id="inbox-count"></span></div>
          <div class="inbox" id="inbox"></div>
        </section>

        <section class="panel activity" aria-label="Activity">
          <div class="panel-head"><h2>Activity</h2><span class="panel-note" id="activity-note"></span></div>
          <ol class="feed" id="feed"></ol>
        </section>
      </div>
    </main>
  </div>
  <div id="toasts" aria-live="polite"></div>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
