<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quorum</title>
  <link rel="icon" href="data:,">
  <style>html, body { background: #0A0E16; margin: 0; }</style>
  <!-- Assets are always at /web/: the device server sends this page at "/" and mounts app/web at
       "/web"; a plain static server rooted at app/ serves the same paths. -->
  <!-- The one webfont: Shantell Sans 700 for the handwritten Q in the Quorum mark. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@700&display=swap">
  <link rel="stylesheet" href="/web/styles.css">
  <!-- Optional look, layered over the CSS above: scripts\demo.ps1 -Look studio names it on <html>, and
       ?look=studio or ?look=classic overrides it for this page. Classic loads nothing extra. -->
  <script>
    (function () {
      var el = document.documentElement, look = new URLSearchParams(location.search).get('look') || el.getAttribute('data-look');
      if (look === 'studio') { el.setAttribute('data-look', look); document.write('<link rel="stylesheet" href="/web/looks/studio.css">'); }
      else el.removeAttribute('data-look');
    })();
  </script>
</head>
<body>
  <div id="app" class="device-app"></div>

  <script type="module" src="/web/app.js"></script>
</body>
</html>
