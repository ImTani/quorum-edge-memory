<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quorum</title>
  <!-- A teammate's Quorum, sized for a phone: ask, quick note, conflicts, the latest claims. Served by a device
       started with --host 0.0.0.0 (scripts\demo.ps1 -Phone), opened at http://<laptop ip>:<port>/phone.
       Same API as the laptop pages (app/CONTRACT.md); live over SSE. -->
  <meta name="theme-color" content="#eef0f3">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Quorum">
  <link rel="manifest" href="/web/phone.webmanifest">
  <link rel="icon" href="/web/icons/quorum-192.png">
  <link rel="apple-touch-icon" href="/web/icons/quorum-180.png">
  <style>
    @font-face { font-family: "Schibsted Grotesk"; src: url(/web/looks/fonts/schibsted-grotesk-400.woff2) format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Schibsted Grotesk"; src: url(/web/looks/fonts/schibsted-grotesk-500.woff2) format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Schibsted Grotesk"; src: url(/web/looks/fonts/schibsted-grotesk-600.woff2) format("woff2"); font-weight: 600; font-display: swap; }
    @font-face { font-family: "Schibsted Grotesk"; src: url(/web/looks/fonts/schibsted-grotesk-700.woff2) format("woff2"); font-weight: 700; font-display: swap; }
    :root { --paper: #eef0f3; --card: #fff; --line: #dfe2e8; --ink: #14171f; --ink2: #3b4150; --ink3: #656b7a;
      --blue: #1f4fd8; --red: #c81e34; --green: #14895a; --amber: #b7791f; --yellow: #ffe14d;
      --ui: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { background: var(--paper); color: var(--ink); font: 400 16px/1.4 var(--ui); }
    body { padding: max(14px, env(safe-area-inset-top)) 14px calc(28px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
    header { display: flex; align-items: center; gap: 11px; margin-bottom: 12px; }
    .logo { width: 40px; height: 40px; border-radius: 9px; background: var(--yellow); display: grid; place-items: center;
      font: 700 25px/1 var(--ui); color: var(--ink); box-shadow: 0 6px 12px -8px rgba(20,23,31,.5); transform: rotate(-3deg); flex: none; }
    .who { min-width: 0; }
    .who b { display: block; font: 700 21px/1.1 var(--ui); letter-spacing: -.01em; }
    .who span { font: 500 14px var(--ui); color: var(--ink3); }
    .pill { margin-left: auto; display: flex; align-items: center; gap: 7px; padding: 7px 11px; border-radius: 99px; background: var(--card);
      box-shadow: 0 0 0 1px var(--line); font: 600 13px var(--ui); color: var(--ink2); white-space: nowrap; }
    .pill i { width: 9px; height: 9px; border-radius: 50%; background: var(--ink3); }
    .pill.ok i { background: var(--green); } .pill.busy i { background: #e0a020; } .pill.off i { background: var(--red); }
    .count { font: 500 14px var(--ui); color: var(--ink3); margin: -4px 0 12px 51px; }
    section { background: var(--card); border-radius: 16px; box-shadow: 0 0 0 1px var(--line), 0 14px 24px -22px rgba(20,23,31,.5); padding: 14px; margin-bottom: 12px; }
    h2 { font: 700 13px/1 var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); margin-bottom: 10px; }
    form { display: flex; gap: 8px; }
    input, textarea { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 12px; padding: 12px; font: 500 17px/1.3 var(--ui); color: var(--ink); background: #f7f8fa; }
    textarea { resize: none; height: 76px; }
    input:focus, textarea:focus { outline: 2px solid var(--blue); outline-offset: -1px; background: #fff; }
    button { border: 0; border-radius: 12px; padding: 0 16px; font: 700 16px var(--ui); background: var(--ink); color: #fff; min-height: 46px; touch-action: manipulation; }
    button:disabled { opacity: .5; }
    button.primary { background: var(--blue); }
    .chips { display: flex; gap: 7px; flex-wrap: wrap; margin-top: 9px; }
    .chips button { min-height: 36px; padding: 0 12px; font: 600 14px var(--ui); background: #eef1fb; color: var(--blue); border-radius: 99px; }
    .answer { margin-top: 12px; font: 500 17px/1.45 var(--ui); }
    .answer:empty { display: none; }
    .answer .q { font: 600 14px var(--ui); color: var(--ink3); margin-bottom: 4px; }
    .answer.disputed .txt { color: var(--red); }
    .answer .meta { font: 600 13px var(--ui); color: var(--ink3); margin-top: 6px; }
    .cites { list-style: none; margin-top: 8px; display: grid; gap: 6px; }
    .cites li { font: 500 14px/1.35 var(--ui); color: var(--ink2); background: #f7f8fa; border-radius: 10px; padding: 8px 10px; }
    .cites li b { font-weight: 700; color: var(--ink); }
    .note-row { display: flex; gap: 8px; align-items: stretch; }
    .note-row button { align-self: stretch; }
    .msg { font: 600 14px var(--ui); margin-top: 8px; color: var(--ink3); min-height: 1em; }
    .msg.ok { color: var(--green); } .msg.err { color: var(--red); }
    .cf { border-radius: 14px; padding: 12px; background: #fff5f6; box-shadow: 0 0 0 2px var(--red); margin-bottom: 10px; }
    .cf.done { background: #f0faf5; box-shadow: 0 0 0 2px var(--green); }
    .cf .kick { font: 700 12px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--red); }
    .cf.done .kick { color: var(--green); }
    .cf .ttl { font: 700 18px/1.25 var(--ui); margin: 3px 0 8px; }
    .cf .side { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid #f1d6da; }
    .cf.done .side { border-color: #d5eee1; }
    .cf .side b { font: 700 19px var(--ui); }
    .cf .side small { display: block; font: 500 13px var(--ui); color: var(--ink3); }
    .cf .side.lost b { color: var(--ink3); text-decoration: line-through; }
    .cf .side button { min-height: 38px; padding: 0 12px; font-size: 14px; background: var(--green); }
    .cf .wait { font: 600 14px var(--ui); color: var(--ink2); margin-top: 6px; }
    #conflicts:empty { display: none; }
    .claims { list-style: none; display: grid; gap: 8px; }
    .claims li { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 0; border-top: 1px solid #f0f1f4; }
    .claims li:first-child { border-top: 0; padding-top: 0; }
    .claims .t { font: 600 16px/1.3 var(--ui); }
    .claims .s { grid-column: 1; font: 500 13px var(--ui); color: var(--ink3); }
    .claims .st { grid-row: 1 / span 2; grid-column: 2; align-self: center; font: 700 11px var(--ui); letter-spacing: .06em; text-transform: uppercase;
      padding: 4px 8px; border-radius: 99px; background: #eef0f3; color: var(--ink2); }
    .st.synced { background: #e3f2ea; color: var(--green); } .st.queued { background: #fff4d6; color: #8a5a00; }
    .st.private { background: #efe8ff; color: #5b3cc4; } .st.disputed { background: #fde8eb; color: var(--red); } .st.superseded { color: var(--ink3); }
    .claims li.new { animation: landed 2.4s ease-out; }
    @keyframes landed { 0%, 30% { background: #e3f2ea; } }
    .empty { font: 500 15px var(--ui); color: var(--ink3); }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">Q</div>
    <div class="who"><b id="name">Quorum</b><span id="role">connecting…</span></div>
    <div class="pill" id="pill"><i></i><span id="pill-text">…</span></div>
  </header>
  <div class="count" id="count"></div>

  <div id="conflicts"></div>

  <section aria-label="Ask">
    <h2>Ask your team's memory</h2>
    <form id="ask-form" autocomplete="off">
      <input id="ask" type="text" placeholder="What's due this week?" enterkeyhint="search" aria-label="Question">
      <button class="primary" type="submit">Ask</button>
    </form>
    <div class="chips">
      <button type="button" data-q="What's due this week?">What's due this week?</button>
      <button type="button" data-q="When is the Sharma delivery?">When is the Sharma delivery?</button>
    </div>
    <div class="answer" id="answer"></div>
  </section>

  <section aria-label="Quick note">
    <h2>Quick note</h2>
    <form id="note-form" class="note-row" autocomplete="off">
      <textarea id="note" placeholder="e.g. Client says the Sharma delivery moves to the 20th" aria-label="Note" enterkeyhint="send"></textarea>
      <button type="submit">Save</button>
    </form>
    <div class="msg" id="note-msg"></div>
  </section>

  <section aria-label="Latest">
    <h2>Latest</h2>
    <ul class="claims" id="claims"><li class="empty">Loading…</li></ul>
  </section>

  <script type="module" src="/web/phone.js"></script>
</body>
</html>
